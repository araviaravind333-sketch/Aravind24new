name: AravindNews24 Telegram Urgent Breaking

# For a breaking story the USER personally spots and sends to the bot
# themselves (a link + their own photo/video, sent as a new message, not
# a reply to a regular candidate) -- posts within minutes instead of
# waiting for the 30-min regular queue.
#
# Was */5 (every 5 min); observed GitHub's scheduler silently skipping
# 15+ minutes between runs at that interval while every 30-min workflow
# in this repo fired right on schedule -- GitHub doesn't reliably honor
# sub-10-minute cron. 10 min is close to the practical floor where it
# actually fires consistently. (A proper fix -- a webhook so Telegram
# pushes the message instead of us polling -- was attempted and reverted:
# Telegram only allows EITHER polling (what the rest of this pipeline
# runs on) OR a webhook, never both, so a real webhook needs migrating
# everything off polling at once, not just this one workflow.)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-poster      # same group as every other posting workflow -- never race a git push
  cancel-in-progress: false

jobs:
  telegram-urgent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg (for Reels rendering)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Check for a user-submitted urgent breaking story
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:           ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY:      ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main telegram-urgent

      - name: Push rendered image/video + offset state
        run: |
          git config user.name "aravindnews24-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/ data/telegram_offset.json data/telegram_inbox/ || true
          git commit -m "auto: telegram urgent check $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Publish to Instagram + Facebook (no-op if nothing pending)
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_ID:            ${{ secrets.META_APP_ID }}
          META_APP_SECRET:        ${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID:             ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:             ${{ secrets.IG_USER_ID }}
          GH_PAGES_BASE:          ${{ vars.GH_PAGES_BASE }}
        run: python -m src.main publish

      - name: Commit state (posted log + analytics, if anything changed)
        run: |
          git add data/ || true
          git commit -m "auto: telegram urgent post cycle $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || echo "push skipped"
