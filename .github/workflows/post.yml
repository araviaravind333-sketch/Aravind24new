name: AravindNews24 Auto Poster

# Times are UTC. IST = UTC + 5:30.
# Fixed daily plan (must match config/settings.py DAILY_SCHEDULE):
#   India: 4 posts + 2 Reels   World: 1 post + 1 Reel   = 8/day
on:
  schedule:
    - cron: '30 20 * * *'   # 02:00 IST — world, post
    - cron: '30 23 * * *'   # 05:00 IST — india, post
    - cron: '30 2 * * *'    # 08:00 IST — india, reel
    - cron: '30 5 * * *'    # 11:00 IST — india, post
    - cron: '30 8 * * *'    # 14:00 IST — india, post
    - cron: '30 11 * * *'   # 17:00 IST — india, reel
    - cron: '30 14 * * *'   # 20:00 IST — india, post
    - cron: '30 17 * * *'   # 23:00 IST — world, reel
  workflow_dispatch:          # allow manual "Run now" button

permissions:
  contents: write             # to commit posted.json + performance.csv
  pages: write
  id-token: write

concurrency:
  group: auto-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg (for Reels rendering)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Render post (news + AI rewrite + stock photo + reel)
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY:    ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python -m src.main render

      - name: Push rendered image (so it has a public URL)
        run: |
          git config user.name "aravindnews24-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/ || true
          git commit -m "auto: render $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Publish to Instagram + Facebook
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_ID:            ${{ secrets.META_APP_ID }}
          META_APP_SECRET:        ${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID:             ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:             ${{ secrets.IG_USER_ID }}
          GH_PAGES_BASE:          ${{ vars.GH_PAGES_BASE }}
        run: python -m src.main publish

      - name: Commit state (posted log + analytics)
        run: |
          git add data/ || true
          git commit -m "auto: post cycle $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Deploy image gallery to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Publish Pages artifact
        uses: actions/deploy-pages@v4
