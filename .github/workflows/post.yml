name: AravindNews24 Auto Poster

# Times are UTC. IST = UTC + 5:30
# India window 05:00-23:00 IST  => 23:30 prev-day..17:30 UTC
# Every 4 hours at IST 05:00, 09:00, 13:00, 17:00, 21:00  (world: 01:00)
# UTC equivalents: 23:30, 03:30, 07:30, 11:30, 15:30, 19:30
on:
  schedule:
    - cron: '30 23 * * *'   # 05:00 IST
    - cron: '30 3 * * *'    # 09:00 IST
    - cron: '30 7 * * *'    # 13:00 IST
    - cron: '30 11 * * *'   # 17:00 IST
    - cron: '30 15 * * *'   # 21:00 IST
    - cron: '30 19 * * *'   # 01:00 IST (world window)
  workflow_dispatch:          # allow manual "Run now" button

permissions:
  contents: write             # to commit posted.json + performance.csv
  pages: write
  id-token: write

concurrency:
  group: auto-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Render post (news + AI rewrite + stock photo)
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY:    ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python -m src.main render

      - name: Push rendered image (so it has a public URL)
        run: |
          git config user.name "aravindnews24-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/ || true
          git commit -m "auto: render $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Publish to Instagram + Facebook
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_ID:            ${{ secrets.META_APP_ID }}
          META_APP_SECRET:        ${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID:             ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:             ${{ secrets.IG_USER_ID }}
          GH_PAGES_BASE:          ${{ vars.GH_PAGES_BASE }}
        run: python -m src.main publish

      - name: Commit state (posted log + analytics)
        run: |
          git add data/ || true
          git commit -m "auto: post cycle $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Deploy image gallery to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Publish Pages artifact
        uses: actions/deploy-pages@v4
