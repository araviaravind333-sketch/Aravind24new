name: AravindNews24 Daily Carousel

# One flagship multi-slide post per day, competitor-style (several of the
# day's strongest stories as numbered slides in ONE Instagram/Facebook
# post, instead of separate single-story posts). Counts as one of the
# automated daily slots -- see config/settings.py
# CAROUSEL_COUNTS_AS_AUTOMATED_SLOT.
#
# Runs every 15 min in the evening window only:
#   - first run at/after CAROUSEL_PREVIEW_HOUR_IST builds it and sends
#     every slide to Telegram for review (reply with a photo/video to
#     replace a slide, or "not good" to drop it)
#   - later runs poll for those replies
#   - once CAROUSEL_REVIEW_GRACE_MINUTES has elapsed since the preview,
#     whatever survived gets published
#
# 20:30-22:30 IST = 15:00-17:00 UTC.
on:
  schedule:
    - cron: '0,15,30,45 15-17 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build + send today''s carousel to Telegram right now, ignoring the 8:30 PM gate (for testing/manual re-runs)'
        type: boolean
        default: false
      force_reel:
        description: 'Build AND POST the voice-over roundup Reel for the latest published carousel even if it is not from today. REAL POST to Instagram.'
        type: boolean
        default: false
      reel_dry_run:
        description: 'Build the voice-over roundup Reel from the latest carousel on the server and report the result -- posts NOTHING (toolchain check)'
        type: boolean
        default: false
      force_publish:
        description: 'Publish immediately, ignoring the review grace period. REAL POST to Instagram + Facebook -- only tick this once you have reviewed the Telegram preview.'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-poster      # shared with every other posting workflow -- never race a git push
  cancel-in-progress: false

jobs:
  carousel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg (for video-slide compositing)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Run carousel self-tests
        run: |
          python -m tests.test_carousel
          python -m tests.test_subject_photos
          python -m tests.test_roundup_reel

      - name: Build / review / publish today's carousel
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:      ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          CAROUSEL_FORCE_BUILD: ${{ github.event.inputs.force_build }}
        run: python -m src.main carousel-cycle

      - name: Push rendered slides + carousel state (makes them public)
        run: |
          git config user.name "aravindnews24-bot"
          git config user.email "bot@users.noreply.github.com"
          # Separate calls, not one combined pathspec -- verified live
          # (public/carousel/2026-09-18/ ended up with only 2 of 9 slide
          # images ever committed): git add fails ATOMICALLY if any
          # single pathspec matches nothing. data/carousel_inbox/ only
          # exists once a reviewer has replied with a photo/video at
          # least once, so on the very first build of the day (before
          # any reply) this line silently staged NOTHING AT ALL --
          # not even the freshly rendered cover + slide images -- and
          # the failure was invisible because carousel_pending.json is
          # ALSO committed separately later in this same job (line ~105
          # below), so the state looked completely correct while the
          # actual image files were missing. That is exactly what made
          # Instagram/Facebook's fetch of cover.jpg 404 on publish.
          git add public/carousel/ || true
          git add data/carousel_pending.json || true
          git add data/carousel_inbox/ || true
          git add data/telegram_offset.json || true
          git commit -m "auto: carousel cycle $(date -u +%FT%TZ)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push failed (attempt $i) -- rebasing on remote, retrying"
            git pull --rebase --autostash origin main || true
            sleep 3
          done

      - name: Publish carousel to Instagram + Facebook (no-op unless ready)
        # Separate command, run only after the push above -- this is the
        # render -> push -> publish split every other post in this
        # pipeline uses, so anything published here is already reachable
        # at its public GitHub Pages URL, never a not-yet-live one.
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_ID:            ${{ secrets.META_APP_ID }}
          META_APP_SECRET:        ${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID:             ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:             ${{ secrets.IG_USER_ID }}
          GH_PAGES_BASE:          ${{ vars.GH_PAGES_BASE }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          CAROUSEL_FORCE_PUBLISH: ${{ github.event.inputs.force_publish }}
        run: python -m src.main carousel-publish

      - name: Commit publish state
        run: |
          git add data/carousel_pending.json || true
          git commit -m "auto: carousel publish $(date -u +%FT%TZ)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push failed (attempt $i) -- rebasing on remote, retrying"
            git pull --rebase --autostash origin main || true
            sleep 3
          done

      # ------------------------------------------------------------------
      # Daily roundup Reel: a voice-over video of the slides that were just
      # posted. Reels are the one format Instagram shows to non-followers,
      # which is where a 7-follower page's reach has to come from. Every
      # step below is a no-op unless a carousel was actually published in
      # this run, and none of them can fail the job: a reel problem must
      # never affect the carousel that already went out.
      # ------------------------------------------------------------------
      - name: Build roundup reel (voice-over) -- no-op unless a carousel was just published
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          CAROUSEL_REEL_DRYRUN: ${{ github.event.inputs.reel_dry_run }}
          CAROUSEL_FORCE_REEL:  ${{ github.event.inputs.force_reel }}
        run: python -m src.main carousel-reel-build

      - name: Push roundup reel (makes it public)
        continue-on-error: true
        run: |
          git config user.name "aravindnews24-bot"
          git config user.email "bot@users.noreply.github.com"
          # separate calls: git add fails atomically if one pathspec matches nothing
          git add public/carousel/ || true
          git add data/carousel_pending.json || true
          git commit -m "auto: roundup reel $(date -u +%FT%TZ)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push failed (attempt $i) -- rebasing on remote, retrying"
            git pull --rebase --autostash origin main || true
            sleep 3
          done

      - name: Publish roundup reel to Instagram (no-op unless one was built)
        continue-on-error: true
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_ID:            ${{ secrets.META_APP_ID }}
          META_APP_SECRET:        ${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID:             ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:             ${{ secrets.IG_USER_ID }}
          GH_PAGES_BASE:          ${{ vars.GH_PAGES_BASE }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main carousel-reel-publish

      - name: Commit roundup reel state
        continue-on-error: true
        run: |
          git add data/carousel_pending.json || true
          git commit -m "auto: roundup reel state $(date -u +%FT%TZ)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push failed (attempt $i) -- rebasing on remote, retrying"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
