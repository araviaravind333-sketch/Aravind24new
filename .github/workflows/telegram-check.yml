name: AravindNews24 Telegram Candidate Queue

# Every ~30 min: tops up a queue of candidate stories sent to your
# Telegram bot chat (reply with a photo or video to use it for that
# post), and resolves at most one queued item per run -- either using
# whatever you've replied with, an automated image match, or posting
# text-only once the grace period passes with neither.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-poster      # same group as post.yml/breaking-news.yml/whatsapp-check.yml -- never race a git push
  cancel-in-progress: false

jobs:
  telegram-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg (for Reels rendering)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Check Telegram queue, send/resolve candidates
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:           ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY:      ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main telegram-check

      - name: Push rendered image + queue state
        run: |
          git config user.name "aravindnews24-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/ data/telegram_pending.json data/telegram_offset.json || true
          git commit -m "auto: telegram queue $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Publish to Instagram + Facebook (no-op if nothing pending)
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_ID:            ${{ secrets.META_APP_ID }}
          META_APP_SECRET:        ${{ secrets.META_APP_SECRET }}
          FB_PAGE_ID:             ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:             ${{ secrets.IG_USER_ID }}
          GH_PAGES_BASE:          ${{ vars.GH_PAGES_BASE }}
        run: python -m src.main publish

      - name: Commit state (posted log + analytics, if anything changed)
        run: |
          git add data/ || true
          git commit -m "auto: telegram post cycle $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || echo "push skipped"
