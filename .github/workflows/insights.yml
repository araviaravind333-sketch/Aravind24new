name: Daily Insights Refresh

# Once/day — pulls real reach/likes/comments/shares for every post logged
# in data/performance.csv, so the category selector learns from actual
# audience response instead of just post/fail status.
on:
  schedule:
    - cron: '30 18 * * *'   # 00:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh insights
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          # Needed for the follower snapshot -- the per-post insights
          # calls address media by id and never needed the account id,
          # so this was absent and the first snapshot asked the Graph
          # API for object "None".
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m src.insights
      - name: Commit updated performance.csv
        run: |
          git config user.name "aravindnews24-bot"
          git config user.email "bot@users.noreply.github.com"
          # Separate `git add` calls on purpose: one add with a pathspec
          # that does not exist yet fails atomically and stages NOTHING,
          # which has silently swallowed a whole run's data in this repo
          # before. followers.csv will not exist until the first
          # successful snapshot.
          git add data/performance.csv || true
          git add data/followers.csv || true
          git commit -m "auto: daily insights refresh $(date -u +%FT%TZ)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push failed (attempt $i) -- rebasing on remote, retrying"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
